      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PadlockAssignment"

  /inventory/padlock-assignments/{id}:
    patch:
      operationId: updatePadlockAssignment
      tags: [inventory]
      summary: Update details of a padlock assignment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePadlockAssignmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PadlockAssignment"

  /inventory/padlock-assignments/{id}/open:
    post:
      operationId: openPadlockAssignment
      tags: [inventory]
      summary: Mark padlock assignment as opened
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PadlockOpenInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PadlockAssignment"

  /inventory/padlock-assignments/{id}/return:
    post:
      operationId: returnPadlockAssignment
      tags: [inventory]
      summary: Mark padlock assignment as returned
      security:
        - bearerAuth: []
      parameters:
        - name: id
