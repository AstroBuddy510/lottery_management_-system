components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginInput:
      type: object
      required: [phone, role, pin]
      properties:
        phone:
          type: string
        role:
          type: string
          enum: [director, administrator, cashier, gross_entry, wins_entry, agent]
        pin:
          type: string
          minLength: 4
          maxLength: 4

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, fullName, phone, role, isActive, createdAt]
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [director, administrator, cashier, gross_entry, wins_entry, agent]
        isActive:
          type: boolean
        profilePicture:
          type: ["string", "null"]
        createdAt:
          type: string
        lastLogin:
          type: ["string", "null"]

    UserCreated:
      type: object
      required: [id, fullName, phone, role, isActive, createdAt, pin]
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [director, administrator, cashier, gross_entry, wins_entry, agent]
        isActive:
          type: boolean
        createdAt:
          type: string
        pin:
          type: string
          description: "Auto-generated 4-digit PIN — show once and communicate to user"

    PinRegenResponse:
      type: object
      required: [pin]
      properties:
        pin:
          type: string

    UpdateMyPhotoBody:
      type: object
      required: [profilePicture]
      properties:
        profilePicture:
          type: ["string", "null"]
          description: Base64 data URL of the new profile photo, or null to remove

    UserInput:
      type: object
      required: [fullName, phone, role]
      properties:
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [director, administrator, cashier, gross_entry, wins_entry, agent]

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [director, administrator, cashier, gross_entry, wins_entry, agent]
        isActive:
          type: boolean
        profilePicture:
          type: ["string", "null"]

    EntryChangeRequest:
      type: object
      required: [id, requestedBy, entryType, entryId, writerId, entryDate, currentAmount, requestedAmount, reason, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        requestedBy:
          type: string
        requestedByName:
          type: ["string", "null"]
        entryType:
          type: string
          enum: [gross, wins]
        entryId:
          type: string
        writerId:
          type: string
        writerFullCode:
          type: ["string", "null"]
        writerFullName:
          type: ["string", "null"]
        agentFullCode:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        entryDate:
          type: string
        currentAmount:
          type: string
        requestedAmount:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending_admin, pending_director, approved, rejected]
        adminNote:
          type: ["string", "null"]
        reviewedByAdmin:
          type: ["string", "null"]
        reviewedByAdminName:
          type: ["string", "null"]
        adminReviewedAt:
          type: ["string", "null"]
        directorNote:
          type: ["string", "null"]
        reviewedByDirector:
          type: ["string", "null"]
        reviewedByDirectorName:
          type: ["string", "null"]
        directorReviewedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateEntryChangeRequestBody:
      type: object
      required: [entryType, entryId, requestedAmount, reason]
      properties:
        entryType:
          type: string
          enum: [gross, wins]
        entryId:
          type: string
        requestedAmount:
          type: string
        reason:
          type: string
          minLength: 5

    AdminReviewEntryChangeRequestBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string

    DirectorReviewEntryChangeRequestBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string

    AgentDebtReduction:
