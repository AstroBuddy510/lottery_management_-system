name: Build writer & agent APKs

# Manual by default - you press "Run workflow" when you want a new build.
# Tagging v1.2.3 also builds and attaches the APKs to a release.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version shown to users (e.g. 1.0.3)"
        required: false
        default: "1.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The keystore lives only in secrets. It is written to a path outside the
      # workspace and deleted again, so it can never be picked up by a later
      # step or left behind in an artifact.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.VS2000_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::VS2000_KEYSTORE_BASE64 is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vs2000-release.jks"
          echo "Keystore restored ($(stat -c%s "$RUNNER_TEMP/vs2000-release.jks") bytes)"

      - name: Build both APKs
        working-directory: android
        env:
          VS2000_KEYSTORE_PATH: ${{ runner.temp }}/vs2000-release.jks
          VS2000_KEYSTORE_PASSWORD: ${{ secrets.VS2000_KEYSTORE_PASSWORD }}
          VS2000_KEY_ALIAS: ${{ secrets.VS2000_KEY_ALIAS }}
          VS2000_KEY_PASSWORD: ${{ secrets.VS2000_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PbuildVersionCode=${{ github.run_number }} \
            -PbuildVersionName="${{ github.event.inputs.versionName || github.ref_name }}" \
            assembleWritersRelease assembleAgentsRelease

      - name: Name the files something a writer will recognise
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/writers/release/*.apk \
             "dist/VS2000-Writers-${{ github.event.inputs.versionName || github.ref_name }}.apk"
          cp android/app/build/outputs/apk/agents/release/*.apk \
             "dist/VS2000-Agents-${{ github.event.inputs.versionName || github.ref_name }}.apk"
          ls -lh dist

      # Upload BEFORE verifying. The first run of this workflow failed its
      # signature check and took the finished APKs down with it - the files
      # existed and were never retrievable. A check that reports on the build
      # must never be able to destroy the build.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs2000-apks
          path: dist/*.apk
          retention-days: 90

      # Proof the signature actually took. A silently unsigned APK will not
      # install, and the failure on the phone is unhelpful, so fail here instead.
      #
      # Deliberately NOT piped into grep: under `bash -e` a grep that matches
      # nothing exits 1 and kills the step, which tells you nothing about why.
      # Print apksigner's own words instead, and report every file before
      # failing, so one bad APK does not hide the state of the other.
      - name: Verify signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: ${APKSIGNER:-** NOT FOUND **}"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          rc=0
          for f in dist/*.apk; do
            echo "::group::$f"
            if "$APKSIGNER" verify --verbose --print-certs "$f"; then
              echo "OK: $f verifies"
            else
              echo "::error::$f failed signature verification"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/vs2000-release.jks"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
